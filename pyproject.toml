[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "ga_core"
dynamic = ["version"]
description = "Package containing the core Green Algorithms methodology to estimate resource consumption and carbon footprint of computational workloads"
authors = [
    {name = "Green Algorithms", email = "green.algorithms@gmail.com"}
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<4.0"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "pandas==2.3.2",
    "numpy==2.3.2",
    "requests==2.32.3",
]

[tool.poetry]
packages = [{ include = "ga_core", from = "src" }]
version = "0.0.0"  # Placeholder required by Poetry parser

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[tool.pytest.ini_options]
pythonpath = ["."]